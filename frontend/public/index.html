      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Doccion - Adopcion y Cuidados de Mascotas</title>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script type="text/javascript" src="js/jquery-3.4.1.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.js"></script>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBgTljt1KK3A82t7m6R70ckKt4G2ISX6qg&loading=async&libraries=maps&v=weekly&callback=initMap" async defer></script>
    
    <script type="text/javascript" src="js/jquery-3.4.1.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
      var lat = -34.602536;
      var lng = -58.441710;
    
      // 1. Inicializar el mapa centrado en Buenos Aires con zoom 15
      var map = L.map('map').setView([lat, lng], 15);
    
      // 2. Cargar las imágenes del mapa (Tiles) desde OpenStreetMap (Gratis)
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
    
      // 3. Clavar el marcador del refugio
      var marker = L.marker([lat, lng]).addTo(map);
      marker.bindPopup("<b>¡Nuestro Refugio y Clínica!</b><br>Atención gratuita.").openPopup();
    </script>
    
  </body>
</html>
